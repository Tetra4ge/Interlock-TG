<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Helvetica, Arial, sans-serif">
  <title>Interlock architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#0f172a">Interlock: system architecture</text>
  <text x="40" y="62" font-size="13" fill="#475569">Offline build writes the graph and indexes; the online layer answers questions over them.</text>

  <!-- Offline build -->
  <rect x="30" y="90" width="330" height="500" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="118" font-size="15" font-weight="700" fill="#0f172a">Offline build (hl build-graph)</text>
  <rect x="50" y="140" width="290" height="46" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="195" y="168" font-size="13" text-anchor="middle" fill="#0f172a">PDFs: fetch, inbox, registry</text>
  <rect x="50" y="206" width="290" height="46" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="195" y="234" font-size="13" text-anchor="middle" fill="#0f172a">Parse, sections, chunks</text>
  <rect x="50" y="272" width="290" height="46" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="195" y="300" font-size="13" text-anchor="middle" fill="#0f172a">LLM extraction, grounding, validation</text>
  <rect x="50" y="338" width="290" height="46" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="195" y="366" font-size="13" text-anchor="middle" fill="#0f172a">Entity resolution (Union-Find)</text>
  <rect x="50" y="404" width="290" height="46" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="195" y="432" font-size="13" text-anchor="middle" fill="#0f172a">Load graph, MENTIONS, embeddings</text>
  <line x1="195" y1="186" x2="195" y2="206" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="195" y1="252" x2="195" y2="272" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="195" y1="318" x2="195" y2="338" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="195" y1="384" x2="195" y2="404" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="50" y="484" font-size="12" fill="#475569">Resumable with --from &lt;step&gt;</text>
  <text x="50" y="504" font-size="12" fill="#475569">LLM calls go through a cached, spend-capped gateway.</text>

  <!-- Stores -->
  <rect x="400" y="470" width="300" height="120" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="550" y="496" font-size="15" font-weight="700" text-anchor="middle" fill="#7c2d12">Stores</text>
  <rect x="420" y="508" width="260" height="34" rx="6" fill="#ffffff" stroke="#fb923c"/>
  <text x="550" y="530" font-size="12" text-anchor="middle" fill="#7c2d12">TigerGraph: graph + installed queries</text>
  <rect x="420" y="550" width="260" height="30" rx="6" fill="#ffffff" stroke="#fb923c"/>
  <text x="550" y="570" font-size="12" text-anchor="middle" fill="#7c2d12">Turso/libSQL: runs, records, traces</text>

  <!-- Online layer -->
  <rect x="400" y="90" width="670" height="350" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="420" y="118" font-size="15" font-weight="700" fill="#0f172a">Online layer</text>
  <rect x="420" y="134" width="180" height="56" rx="6" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="510" y="158" font-size="13" font-weight="700" text-anchor="middle" fill="#0c4a6e">Dashboard</text>
  <text x="510" y="176" font-size="11" text-anchor="middle" fill="#0c4a6e">Next.js, 7 pages</text>
  <rect x="640" y="134" width="180" height="56" rx="6" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="730" y="158" font-size="13" font-weight="700" text-anchor="middle" fill="#0c4a6e">API</text>
  <text x="730" y="176" font-size="11" text-anchor="middle" fill="#0c4a6e">FastAPI, demo mode</text>

  <rect x="420" y="220" width="200" height="200" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="520" y="244" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">Three pipelines</text>
  <rect x="436" y="256" width="168" height="34" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="520" y="278" font-size="12" text-anchor="middle" fill="#0f172a">RAG: vector + BM25</text>
  <rect x="436" y="300" width="168" height="34" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="520" y="322" font-size="12" text-anchor="middle" fill="#0f172a">GraphRAG: expand_hop</text>
  <rect x="436" y="344" width="168" height="34" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="520" y="366" font-size="12" text-anchor="middle" fill="#0f172a">Agent: tools + verifier</text>

  <rect x="650" y="220" width="200" height="200" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="750" y="244" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">Retrieval and models</text>
  <text x="750" y="272" font-size="12" text-anchor="middle" fill="#0f172a">all-MiniLM-L6-v2 (local)</text>
  <text x="750" y="292" font-size="12" text-anchor="middle" fill="#0f172a">NumPy .npz vector index</text>
  <text x="750" y="324" font-size="12" text-anchor="middle" fill="#0f172a">Groq LLM (shared</text>
  <text x="750" y="342" font-size="12" text-anchor="middle" fill="#0f172a">final-answer prompt)</text>

  <!-- Arrows -->
  <line x1="510" y1="190" x2="510" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="190" x2="730" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="317" x2="650" y2="317" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="420" x2="520" y2="470" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="440" x2="620" y2="470" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="427" x2="400" y2="527" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- Eval note -->
  <text x="40" y="620" font-size="12" fill="#475569">Eval harness (hl eval, hl compare) runs the same three pipelines on the frozen question split and writes scores to the run store.</text>
</svg>
