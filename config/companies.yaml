# Selection rule: the five Phase 2 pilot companies, plus the four other listed Tata/Bajaj
# group companies whose annual reports are registered in the corpus, so that board and
# related-party links between group companies exist for multi-hop questions.
# Pilot criteria fulfilled:
# 1. At least 2 different sectors (Auto, Finance, Metals, Machinery).
# 2. At least 1 large group structure (TATAMOTORS).
# 3. At least 1 named in a regulatory order (BAJFINANCE - RBI order in late 2023).
# 4. At least 1 older/smaller company with messier PDFs (TRF - small cap Tata entity).

fiscal_years: ["FY2021-22", "FY2022-23", "FY2023-24"]

# annual_report is required for every company/year.
doc_types: [annual_report, shareholding, rpt_disclosure]

companies:
