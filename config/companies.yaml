# Phase 2 Pilot Selection
# We have restricted this to 5 companies specifically chosen to meet the Phase 2 Step 1 criteria
# while maintaining the Tata/Bajaj group overlap for future multi-hop graph testing.
# Criteria fulfilled:
# 1. At least 2 different sectors (Auto, Finance, Metals, Machinery).
# 2. At least 1 large group structure (TATAMOTORS).
# 3. At least 1 named in a regulatory order (BAJFINANCE - RBI order in late 2023).
# 4. At least 1 older/smaller company with messier PDFs (TRF - small cap Tata entity).

fiscal_years: ["FY2021-22", "FY2022-23", "FY2023-24"]

# annual_report is required for every company/year.
doc_types: [annual_report, shareholding, rpt_disclosure]

companies:
  - company_id: "TATAMOTORS"
    name: "Tata Motors Limited"
    exchange_codes: {bse: "500570", nse: "TATAMOTORS"}
    cin: null
    sector: "Automobiles"
    selection_reason: "Pilot: Large group structure (many subsidiaries and related parties)"

  - company_id: "BAJFINANCE"
    name: "Bajaj Finance Limited"
    exchange_codes: {bse: "500034", nse: "BAJFINANCE"}
    cin: null
    sector: "Financial Services (NBFC)"
    selection_reason: "Pilot: Named in a regulatory order (RBI restrictions in late 2023)"

  - company_id: "TATASTEEL"
    name: "Tata Steel Limited"
    exchange_codes: {bse: "500470", nse: "TATASTEEL"}
    cin: null
    sector: "Metals & Mining"
    selection_reason: "Pilot: Different sector, large-scale operations"

  - company_id: "TRF"
    name: "TRF Limited"
    exchange_codes: {bse: "505854", nse: "TRF"}
    cin: null
    sector: "Industrial Machinery"
    selection_reason: "Pilot: Older and smaller company (small cap), often has messier PDFs"

  - company_id: "BAJAJFINSV"
    name: "Bajaj Finserv Limited"
    exchange_codes: {bse: "532978", nse: "BAJAJFINSV"}
    cin: null
    sector: "Financial Services (Holding)"
    selection_reason: "Pilot: Holding company structure for diverse group entities"
