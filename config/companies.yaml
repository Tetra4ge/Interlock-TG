# Selection rule: all listed group entities of the Bajaj Group and the Tata Group, as of
# 2026-09-28, restricted to entities with a full annual report available for each of
# FY2021-22, FY2022-23 and FY2023-24. Two business groups (not unrelated single companies)
# so the graph has real shared-director / related-party-transaction edges to answer
# multi-hop questions with, while staying auditable (every group entity included, none
# hand-picked for being "interesting"). Full rationale: docs/decisions/0000-scope.md §1a.
# Rule applied on: 2026-09-28
# Verify: exchange_codes below are from general knowledge, not a live BSE/NSE lookup
# (this environment's access to nseindia.com was blocked at the TLS/HTTP layer during
# Phase 1 source-checking -- see docs/sources.md). Confirm each code on bseindia.com /
# nseindia.com before using it for automated fetching; they are not load-bearing for
# manual-inbox ingestion, which keys off company_id instead.

fiscal_years: ["FY2021-22", "FY2022-23", "FY2023-24"]

# annual_report is required for every company/year (Phase 1 exit criteria).
# shareholding and rpt_disclosure are optional/best-effort: they live on the exchange
# sites, not company investor-relations pages, and Step 3 source-checking found those
# sites behind bot-detection -- see docs/sources.md. Marked manual_needed, not blocking.
doc_types: [annual_report, shareholding, rpt_disclosure]

