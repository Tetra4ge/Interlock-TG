name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run ruff check server tests spikes
      - run: uv run ruff format --check server tests spikes
      - run: uv run mypy server
      # Integration tests need a live TigerGraph and a real LLM, so they are excluded by
      # default (pyproject addopts). They run locally before a release tag; see docs/test-plan.md.
      - run: uv run pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      # Build first: Next generates the route and layout types that typecheck needs.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  docker:
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker build -t interlock-api .
      - run: docker build -t interlock-dashboard ./dashboard
