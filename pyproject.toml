[project]
name = "interlock-tg"
version = "0.1.0"
description = "Agentic GraphRAG System"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.1",
    "httpx>=0.25.0",
    "pyTigerGraph>=1.5.0",
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0",
    "rapidfuzz>=3.0.0",
    "groq>=1.7.0",
    "libsql>=0.1.11",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
packages = ["server"]

[[tool.mypy.overrides]]
module = ["libsql", "pyTigerGraph", "pyTigerGraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: requires a live external service (TigerGraph, real LLM API)",
]
