[project]
name = "interlock-tg"
version = "0.1.0"
description = "Agentic GraphRAG System"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.1",
    "httpx>=0.25.0",
    "pyTigerGraph>=1.5.0",
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0",
    "rapidfuzz>=3.0.0",
    "groq>=1.7.0",
    "libsql>=0.1.11",
    "sentence-transformers>=6.1.0",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
hl = "server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
packages = ["server"]

[[tool.mypy.overrides]]
module = ["libsql", "fitz", "pyTigerGraph", "pyTigerGraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
# Excluded by default: TG_HOST now points at a live TigerGraph Savanna workspace
# (see .env), and the integration test drops/recreates a graph + installs a
# query every run -- several seconds of real cloud compute against trial
# credits per invocation. Run explicitly with: uv run pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: requires a live external service (TigerGraph, real LLM API)",
]
